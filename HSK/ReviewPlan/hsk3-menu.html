<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 3 复习计划</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --red: #c0392b;
    --gold: #b8860b;
    --gold-light: #d4a843;
    --muted: #8a7f6e;
    --border: #d4c9b0;
    --week-bg: #fffdf7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(180,160,100,0.08) 31px, rgba(180,160,100,0.08) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(180,160,100,0.05) 31px, rgba(180,160,100,0.05) 32px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 3rem 2rem 6rem;
  }

  header {
    text-align: center;
    margin-bottom: 3.5rem;
    animation: fadeDown 0.8s ease both;
  }

  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border: 2.5px solid var(--red);
    border-radius: 4px;
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    color: var(--red);
    font-weight: 700;
    margin-bottom: 1.2rem;
    transform: rotate(-5deg);
    letter-spacing: 0.05em;
  }

  .title-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(2.8rem, 7vw, 5rem);
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 0.4rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  .exam-banner {
    background: var(--ink);
    color: var(--paper);
    border-radius: 6px;
    padding: 1.5rem 2rem;
    margin-bottom: 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    animation: fadeUp 0.8s 0.2s ease both;
    position: relative;
    overflow: hidden;
  }

  .exam-banner::before {
    content: '考';
    position: absolute;
    right: -0.5rem;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Noto Serif SC', serif;
    font-size: 8rem;
    font-weight: 700;
    color: rgba(255,255,255,0.04);
    line-height: 1;
    pointer-events: none;
  }

  .exam-info { display: flex; flex-direction: column; gap: 0.3rem; }

  .exam-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: var(--gold-light);
    text-transform: uppercase;
  }

  .exam-date-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: #fff;
  }

  .exam-sub {
    font-size: 0.8rem;
    color: rgba(245,240,232,0.5);
    font-weight: 300;
  }

  .countdown { display: flex; gap: 1rem; align-items: center; }
  .count-unit { text-align: center; }

  .count-num {
    font-family: 'DM Mono', monospace;
    font-size: 2rem;
    font-weight: 500;
    color: var(--gold-light);
    line-height: 1;
    display: block;
  }

  .count-label {
    font-size: 0.6rem;
    color: rgba(245,240,232,0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    display: block;
  }

  .count-sep {
    font-family: 'DM Mono', monospace;
    color: var(--gold-light);
    font-size: 1.5rem;
    opacity: 0.4;
    margin-bottom: 1rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .section-header h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }

  .section-line { flex: 1; height: 1px; background: var(--border); }

  .ornament {
    text-align: center;
    margin: 0.5rem 0 2rem;
    color: var(--gold);
    opacity: 0.5;
    font-size: 1rem;
    animation: fadeUp 0.8s 0.25s ease both;
  }

  /* Square week cards */
  .weeks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 0.85rem;
  }

  .week-card {
    background: var(--week-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    padding: 0.7rem;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  .week-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 16px rgba(184,134,11,0.13);
    transform: translateY(-2px);
  }

  .week-card.locked {
    opacity: 0.3;
    cursor: default;
  }

  .week-card.locked:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: none;
  }

  .week-card.current {
    border-color: var(--gold);
    background: linear-gradient(135deg, #fffdf7, #fef9ec);
    box-shadow: 0 4px 20px rgba(184,134,11,0.15);
  }

  .wk-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .wk-num {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .week-card.current .wk-num { color: var(--gold); }

  .wk-dates {
    font-size: 0.56rem;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.65;
  }

  .current-dot {
    position: absolute;
    top: 0.55rem;
    right: 0.55rem;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  .lock-icon {
    position: absolute;
    bottom: 0.4rem;
    right: 0.4rem;
    font-size: 0.52rem;
    opacity: 0.2;
  }

  .footer-note {
    text-align: center;
    margin-top: 4rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
    animation: fadeUp 0.8s 0.8s ease both;
  }


  .back-btn {
    position: fixed;
    top: 1rem;
    left: 1.2rem;
    z-index: 100;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.45rem 0.9rem;
    transition: all 0.2s;
  }

  .back-btn:hover {
    color: var(--ink);
    border-color: var(--ink);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .exam-banner { flex-direction: column; align-items: flex-start; gap: 1rem; }
    h1 { font-size: 3rem; }
    .weeks-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  }
</style>
</head>
<body>
<a class="back-btn" href="../hsk-menu.html">← Back To HSK Menu</a>
<div class="container">

  <header>
    <div class="seal">三级</div>
    <div class="title-label">汉语水平考试</div>
    <h1>HSK 3</h1>
    <p class="subtitle">复习计划 · Study Review Plan</p>
  </header>

  <div class="exam-banner">
    <div class="exam-info">
      <span class="exam-tag">📅 考试日期 · Exam Date</span>
      <span class="exam-date-text">2026年10月17日（星期六）</span>
      <span class="exam-sub">伦敦时间 · London Time</span>
    </div>
    <div class="countdown">
      <div class="count-unit">
        <span class="count-num" id="days">--</span>
        <span class="count-label">天 Days</span>
      </div>
      <span class="count-sep">:</span>
      <div class="count-unit">
        <span class="count-num" id="hours">--</span>
        <span class="count-label">时 Hrs</span>
      </div>
      <span class="count-sep">:</span>
      <div class="count-unit">
        <span class="count-num" id="minutes">--</span>
        <span class="count-label">分 Min</span>
      </div>
    </div>
  </div>

  <div class="section-header">
    <h2>每周学习内容 Weekly Lessons</h2>
    <div class="section-line"></div>
  </div>

  <div class="ornament">· · ·</div>

  <div class="weeks-grid" id="weeksGrid"></div>

  <p class="footer-note">加油！你一定可以的 ✦ You've got this!</p>
</div>

<script>
  // Countdown
  function updateCountdown() {
    const examDate = new Date('2026-10-17T09:00:00+01:00');
    const diff = examDate - new Date();
    if (diff <= 0) {
      ['days','hours','minutes'].forEach(id => document.getElementById(id).textContent = '00');
      return;
    }
    document.getElementById('days').textContent    = String(Math.floor(diff / 86400000)).padStart(2,'0');
    document.getElementById('hours').textContent   = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
  }
  updateCountdown();
  setInterval(updateCountdown, 30000);

  // Generate week cards: May 3 → Oct 16, 2026
  const START = new Date('2026-05-03T00:00:00');
  const END   = new Date('2026-10-16T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);

  function fmt(d) { return (d.getMonth()+1) + '月' + d.getDate() + '日'; }

  const grid = document.getElementById('weeksGrid');
  let weekStart = new Date(START);
  let n = 1;

  while (weekStart <= END) {
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const displayEnd = weekEnd > END ? new Date(END) : new Date(weekEnd);

    // Current = today is within this week's range
    const isCurrent = today >= weekStart && today <= weekEnd;

    const slug = 'week' + String(n).padStart(2,'0') + '.html';

    const card = document.createElement('a');
    card.href = slug;
    card.className = 'week-card' + (isCurrent ? ' current' : '');
    card.style.animationDelay = (0.3 + n * 0.025) + 's';

    card.innerHTML =
      '<span class="wk-label">Week</span>' +
      '<span class="wk-num">' + String(n).padStart(2,'0') + '</span>' +
      '<span class="wk-dates">' + fmt(weekStart) + ' – ' + fmt(displayEnd) + '</span>' +
      (isCurrent ? '<span class="current-dot"></span>' : '');

    card.addEventListener('click', function(e) {
      e.preventDefault();
      fetch(slug, { method: 'HEAD' })
        .then(res => {
          window.location.href = res.ok ? slug : 'coming-soon.html';
        })
        .catch(() => {
          window.location.href = 'coming-soon.html';
        });
    });

    grid.appendChild(card);

    weekStart.setDate(weekStart.getDate() + 7);
    n++;
    if (n > 50) break;
  }
</script>
</body>
</html>
