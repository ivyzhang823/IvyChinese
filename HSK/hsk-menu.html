<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转中 / Redirecting</title>
    <script>
        // 把旧域名的路径原样拼到新域名后面
        var newBase = "https://ivychinese.eu";
        var path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(newBase + path);
    </script>
</head>
<body>
    <p>正在跳转到新网站 / Redirecting to new site……</p>
    <p>如未自动跳转，请访问 <a href="https://ivychinese.eu/">https://ivychinese.eu/</a></p>
</body>
</html>
